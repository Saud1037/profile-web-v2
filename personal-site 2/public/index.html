<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الشخصي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="page">

  <main id="card" class="card">
    <div id="banner" class="banner"></div>

    <div class="identity">
      <img id="avatar" class="avatar" src="" alt="الصورة الشخصية">
      <h1 id="display-name" class="display-name"></h1>
      <p class="status-line">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text"></span>
      </p>
      <p id="bio" class="bio"></p>

      <div id="socials" class="socials" aria-label="روابط التواصل"></div>
    </div>
  </main>

  <section class="projects-section">
    <h2 class="section-title">مشاريعي</h2>
    <div id="projects" class="projects-grid"></div>
  </section>

  <footer class="site-footer">
    <span id="footer-name"></span>
  </footer>

</div>

<script src="/js/main.js"></script>
</body>
</html>
